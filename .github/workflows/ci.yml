name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: [27.1, 29.4, 30.1]
    steps:
      - uses: actions/checkout@v5
      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Run checks
        run: make check
